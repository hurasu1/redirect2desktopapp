<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>アプリを開いています</title>
<style>
  :root { color-scheme: light dark; --fg:#1d2433; --bg:#f6f7f9; --muted:#5b6474; --link:#2754c5; --box:#e9ecf1; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e6e8ec; --bg:#16191f; --muted:#9aa3b2; --link:#8fb0ff; --box:#232832; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif; }
  main { width:min(36rem, 100% - 3rem); line-height:1.7; }
  p { margin:0 0 .75rem; }
  .muted { color:var(--muted); font-size:.9rem; }
  a { color:var(--link); }
  pre { background:var(--box); padding:.75rem 1rem; border-radius:6px; white-space:pre-wrap; word-break:break-all; font:inherit; font-size:.9rem; max-height:12rem; overflow:auto; }
  button { font:inherit; padding:.5rem 1.1rem; border-radius:6px; border:1px solid var(--muted); background:transparent; color:var(--fg); cursor:pointer; }
  button:focus-visible { outline:2px solid var(--link); outline-offset:2px; }
  [hidden] { display:none; }
</style>
</head>
<body>
<main>
  <p id="msg">開いています…</p>
  <div id="confirm" hidden>
    <pre id="preview"></pre>
    <p><button id="go" type="button">開く</button></p>
  </div>
  <div id="resume" hidden>
    <pre id="resume-cmd"></pre>
    <p><button id="copy" type="button">コマンドをコピー</button> <span class="muted" id="copied"></span></p>
    <p id="resume-links"></p>
  </div>
  <p class="muted" id="alt"></p>
</main>
<script>
  // ===================== 設定 =====================
  // AI（q=プロンプト）: この文言で始まるものだけ確認なしで開く。それ以外は内容を見せてボタンで開く。
  var TRUSTED_PREFIXES = ["Asanaのタスク", "Notionのページ", "このページ"];

  // Slack のワークスペースID（T から始まる）。分かれば入れておくとチャンネルをアプリで直接開ける。
  // 空のままだと、Slack 標準の「アプリで開く」ページ経由になる。
  var SLACK_TEAM_ID = "";

  // ---- AI 系: ?to=xxx&q=プロンプト ----
  var AI_TARGETS = {
    claude:        { name: "Claude Desktop", app: function (e) { return "claude://claude.ai/new?q=" + e; },
                     web: function (e) { return "https://claude.ai/new?q=" + e; } },
    "claude-web":  { name: "Claude（ブラウザ）", app: function (e) { return "https://claude.ai/new?q=" + e; } },
    chatgpt:       { name: "ChatGPT Desktop", app: function (e) { return "codex://new?prompt=" + e; },
                     web: function (e) { return "https://chatgpt.com/?q=" + e; } },
    "chatgpt-web": { name: "ChatGPT（ブラウザ）", app: function (e) { return "https://chatgpt.com/?q=" + e; } }
  };

  // ---- アプリ系: ?to=xxx&url=元のhttpsリンク ----
  // hosts に合わないURLは開かない（関係ないサイトへ飛ばされないように）。
  var APP_TARGETS = {
    asana: {
      name: "Asana", hosts: /^app\.asana\.com$/,
      app: function (u) { return "asanadesktop:///app" + u.pathname + u.search; }
    },
    notion: {
      name: "Notion", hosts: /(^|\.)notion\.(so|site|com)$/,
      app: function (u) {
        // https://app.notion.com/p/<32桁のID> は、アプリが確実に開ける notion://www.notion.so/<ID> に直す
        var m = u.hostname === "app.notion.com" && u.pathname.match(/([0-9a-f]{32})/i);
        if (m) return "notion://www.notion.so/" + m[1] + u.search + u.hash;
        return "notion://" + u.host + u.pathname + u.search + u.hash;
      }
    },
    slack: {
      name: "Slack", hosts: /(^|\.)slack\.com$/,
      app: function (u) {
        var m;
        // https://app.slack.com/client/T.../C...
        if ((m = u.pathname.match(/^\/client\/(T[A-Z0-9]+)\/([CDG][A-Z0-9]+)/))) {
          return "slack://channel?team=" + m[1] + "&id=" + m[2];
        }
        // https://xxx.slack.com/archives/C.../p...（メッセージ単位はアプリ直行できないのでチャンネルを開く）
        if (SLACK_TEAM_ID && (m = u.pathname.match(/^\/archives\/([CDG][A-Z0-9]+)/))) {
          return "slack://channel?team=" + SLACK_TEAM_ID + "&id=" + m[1];
        }
        return null; // 変換できないものは元のリンク（Slack 標準の「アプリで開く」ページ）へ
      }
    }
  };
  // ---- エディタ系: ?to=vscode&path=/絶対パス[&line=行番号][&host=SSHのホスト名] ----
  // フォルダやファイルを VS Code で開く。host があれば Remote-SSH で SSH 先を開く。
  // 絶対パスだけ受け付け、".." を含むものは開かない。host は ~/.ssh/config の Host 名か IP（user@ も可）。
  var EDITOR_TARGETS = {
    vscode: { name: "VS Code", scheme: "vscode://file", remote: "vscode://vscode-remote/ssh-remote+" }
  };
  // ---- セッションの再開: ?to=claude-resume&session=<UUID>&path=/作業フォルダ[&host=SSHのホスト名] ----
  // claude -p で動かしたセッションの続きを開くための案内。
  // host あり（SSH 先）：VS Code で作業フォルダを開き、Claude Code 拡張のパネルでセッションを開くボタンを置く。
  // host なし（この PC）：Claude デスクトップで再開するコマンド（claude --desktop --resume）を出す。
  // どちらも、確実に再開できるターミナル用のコマンドをコピーできるようにしておく。
  var RESUME_TARGETS = { "claude-resume": { name: "Claude Code" } };
  // =================================================

  var params = new URLSearchParams(location.search);
  var to = params.get("to") || "claude";
  var msg = document.getElementById("msg");
  var alt = document.getElementById("alt");

  function fallbackLink(href, label) {
    var a = document.createElement("a");
    a.href = href; a.textContent = label;
    alt.append("アプリが開かない場合は ", a);
  }

  if (AI_TARGETS[to]) {
    var t = AI_TARGETS[to];
    var q = params.get("q") || "";
    if (!q) {
      msg.textContent = "プロンプトが空です。q= に開きたい内容を入れてください。";
    } else {
      var enc = encodeURIComponent(q);
      var appUrl = t.app(enc);
      if (t.web) fallbackLink(t.web(enc), "ブラウザで開く");
      var trusted = TRUSTED_PREFIXES.some(function (p) { return q.indexOf(p) === 0; });
      if (trusted) {
        msg.textContent = t.name + "を開いています…";
        location.href = appUrl;
      } else {
        msg.textContent = "次の内容で" + t.name + "を開きます。心当たりがなければ閉じてください。";
        document.getElementById("preview").textContent = q;
        document.getElementById("confirm").hidden = false;
        document.getElementById("go").addEventListener("click", function () { location.href = appUrl; });
      }
    }
  } else if (APP_TARGETS[to]) {
    var a = APP_TARGETS[to];
    var u = null;
    try { u = new URL(params.get("url") || ""); } catch (e) {}
    if (!u || u.protocol !== "https:" || !a.hosts.test(u.hostname)) {
      msg.textContent = a.name + "のリンクではないため開けません。url= に" + a.name + "のhttpsリンクを入れてください。";
    } else {
      var dest = a.app(u);
      fallbackLink(u.href, "ブラウザで開く");
      msg.textContent = a.name + "を開いています…";
      location.href = dest || u.href;
    }
  } else if (EDITOR_TARGETS[to]) {
    var ed = EDITOR_TARGETS[to];
    var path = params.get("path") || "";
    var line = params.get("line") || "";
    var host = params.get("host") || "";
    if (path.charAt(0) !== "/" || path.split("/").indexOf("..") !== -1) {
      msg.textContent = "path= には開きたいフォルダかファイルの絶対パス（/ で始まるもの）を入れてください。";
    } else if (line && !/^\d+$/.test(line)) {
      msg.textContent = "line= には行番号（数字）を入れてください。";
    } else if (host && !/^([A-Za-z0-9._-]+@)?[A-Za-z0-9._-]+$/.test(host)) {
      msg.textContent = "host= には SSH のホスト名（~/.ssh/config の Host 名か IP）を入れてください。";
    } else {
      // SSH 先で行番号まで飛べるかは未確認なので、SSH 先ではファイルかフォルダを開くだけにしている
      var edUrl = host ? ed.remote + host + encodeURI(path)
                       : ed.scheme + encodeURI(path) + (line ? ":" + line : "");
      msg.textContent = ed.name + "で開いています…" + (host ? "（SSH: " + host + "）" : "");
      alt.textContent = (host ? host + ":" : "") + path;
      location.href = edUrl;
    }
  } else if (RESUME_TARGETS[to]) {
    var rt = RESUME_TARGETS[to];
    var session = params.get("session") || "";
    var rpath = params.get("path") || "";
    var rhost = params.get("host") || "";
    if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(session)) {
      msg.textContent = "session= にはセッション ID（UUID）を入れてください。";
    } else if (rpath.charAt(0) !== "/" || rpath.split("/").indexOf("..") !== -1 || !/^[A-Za-z0-9._\/-]+$/.test(rpath)) {
      msg.textContent = "path= には作業フォルダの絶対パス（/ で始まるもの）を入れてください。";
    } else if (rhost && !/^([A-Za-z0-9._-]+@)?[A-Za-z0-9._-]+$/.test(rhost)) {
      msg.textContent = "host= には SSH のホスト名（~/.ssh/config の Host 名か IP）を入れてください。";
    } else {
      var cmd = rhost ? "cd " + rpath + " && claude --resume " + session
                      : "cd " + rpath + " && claude --desktop --resume " + session;
      var cmdBox = document.getElementById("resume-cmd");
      cmdBox.textContent = (rhost ? "# " + rhost + " のターミナルで実行\n" : "# この PC のターミナルで実行（Claude デスクトップで開く）\n") + cmd;
      document.getElementById("resume").hidden = false;
      document.getElementById("copy").addEventListener("click", function () {
        var done = function () { document.getElementById("copied").textContent = "コピーしました"; };
        if (navigator.clipboard) navigator.clipboard.writeText(cmd).then(done, function () {
          document.getElementById("copied").textContent = "コピーできませんでした。上のコマンドを選んでコピーしてください";
        });
      });
      var links = document.getElementById("resume-links");
      if (rhost) {
        var folderUrl = EDITOR_TARGETS.vscode.remote + rhost + encodeURI(rpath);
        var panel = document.createElement("a");
        panel.href = "vscode://anthropic.claude-code/open?session=" + session;
        panel.textContent = "② Claude Code パネルでこのセッションを開く";
        var folder = document.createElement("a");
        folder.href = folderUrl;
        folder.textContent = "① VS Code で作業フォルダを開く（SSH: " + rhost + "）";
        links.append(folder, document.createElement("br"), panel);
        msg.textContent = "VS Code で " + rhost + " の作業フォルダを開いています。開いたら ② を押してください。" +
          "パネルで開けないときは、VS Code のターミナルに下のコマンドを貼り付けてください。";
        location.href = folderUrl;
      } else {
        msg.textContent = "Claude デスクトップで再開します。ターミナルに次のコマンドを貼り付けてください。";
      }
    }
  } else {
    msg.textContent = "転送先「" + to + "」は登録されていません。to= には " +
      Object.keys(AI_TARGETS).concat(Object.keys(APP_TARGETS), Object.keys(EDITOR_TARGETS), Object.keys(RESUME_TARGETS)).join(" / ") + " のどれかを指定してください。";
  }
</script>
</body>
</html>
