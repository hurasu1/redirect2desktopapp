<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>アプリを開いています</title>
<style>
  :root { color-scheme: light dark; --fg:#1d2433; --bg:#f6f7f9; --muted:#5b6474; --link:#2754c5; --box:#e9ecf1; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e6e8ec; --bg:#16191f; --muted:#9aa3b2; --link:#8fb0ff; --box:#232832; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif; }
  main { width:min(36rem, 100% - 3rem); line-height:1.7; }
  p { margin:0 0 .75rem; }
  .muted { color:var(--muted); font-size:.9rem; }
  a { color:var(--link); }
  pre { background:var(--box); padding:.75rem 1rem; border-radius:6px; white-space:pre-wrap; word-break:break-all; font:inherit; font-size:.9rem; max-height:12rem; overflow:auto; }
  button { font:inherit; padding:.5rem 1.1rem; border-radius:6px; border:1px solid var(--muted); background:transparent; color:var(--fg); cursor:pointer; }
  button:focus-visible { outline:2px solid var(--link); outline-offset:2px; }
  [hidden] { display:none; }
</style>
</head>
<body>
<main>
  <p id="msg">開いています…</p>
  <div id="confirm" hidden>
    <pre id="preview"></pre>
    <p><button id="go" type="button">開く</button></p>
  </div>
  <div id="mobile" hidden>
    <pre id="mobile-prompt"></pre>
    <p><button id="m-code" type="button">コピーして Claude Code を開く</button> <span class="muted" id="m-copied"></span></p>
    <p class="muted">Claude Code では、Mac の環境（claude remote-control）を選んで新しいセッションを始め、貼り付けて送ってください。</p>
    <p><button id="m-chat" type="button">チャットで開く（相談だけ）</button></p>
  </div>
  <div id="resume" hidden>
    <pre id="resume-cmd"></pre>
    <p><button id="copy" type="button">コマンドをコピー</button> <span class="muted" id="copied"></span></p>
    <p id="resume-links"></p>
  </div>
  <p class="muted" id="alt"></p>
</main>
<script>
  // ===================== 設定 =====================
  // AI（q=プロンプト）: この文言で始まるものだけ確認なしで開く。それ以外は内容を見せてボタンで開く。
  var TRUSTED_PREFIXES = ["Asanaのタスク", "Notionのページ", "このページ"];

  // Slack のワークスペースID（T から始まる）。分かれば入れておくとチャンネルをアプリで直接開ける。
  // 空のままだと、Slack 標準の「アプリで開く」ページ経由になる。
  var SLACK_TEAM_ID = "";

  // ---- AI 系: ?to=xxx&q=プロンプト ----
  var AI_TARGETS = {
    claude:        { name: "Claude Desktop", app: function (e) { return "claude://claude.ai/new?q=" + e; },
                     web: function (e) { return "https://claude.ai/new?q=" + e; } },
    "claude-web":  { name: "Claude（ブラウザ）", app: function (e) { return "https://claude.ai/new?q=" + e; } },
    chatgpt:       { name: "ChatGPT Desktop", app: function (e) { return "codex://new?prompt=" + e; },
                     web: function (e) { return "https://chatgpt.com/?q=" + e; } },
    "chatgpt-web": { name: "ChatGPT（ブラウザ）", app: function (e) { return "https://chatgpt.com/?q=" + e; } }
  };

  // ---- アプリ系: ?to=xxx&url=元のhttpsリンク ----
  // hosts に合わないURLは開かない（関係ないサイトへ飛ばされないように）。
  var APP_TARGETS = {
    asana: {
      name: "Asana", hosts: /^app\.asana\.com$/,
      app: function (u) { return "asanadesktop:///app" + u.pathname + u.search; }
    },
    notion: {
      name: "Notion", hosts: /(^|\.)notion\.(so|site|com)$/,
      app: function (u) {
        // https://app.notion.com/p/<32桁のID> は、アプリが確実に開ける notion://www.notion.so/<ID> に直す
        var m = u.hostname === "app.notion.com" && u.pathname.match(/([0-9a-f]{32})/i);
        if (m) return "notion://www.notion.so/" + m[1] + u.search + u.hash;
        return "notion://" + u.host + u.pathname + u.search + u.hash;
      }
    },
    slack: {
      name: "Slack", hosts: /(^|\.)slack\.com$/,
      app: function (u) {
        var m;
        // https://app.slack.com/client/T.../C.../thread/C...-<ts>（スレッドの欄を開いた状態でアプリを開く。
        // 返信の下書きが入力欄に出る。公式の資料にない書き方なので、動かなくなったらチャンネルを開くだけに戻す。2026-10-21 Mac で確認）
        if ((m = u.pathname.match(/^\/client\/(T[A-Z0-9]+)\/([CDG][A-Z0-9]+)\/thread\/[CDG][A-Z0-9]+-(\d+\.\d+)/))) {
          return "slack://channel?team=" + m[1] + "&id=" + m[2] + "&message=" + m[3] + "&thread_ts=" + m[3];
        }
        // https://app.slack.com/client/T.../C...
        if ((m = u.pathname.match(/^\/client\/(T[A-Z0-9]+)\/([CDG][A-Z0-9]+)/))) {
          return "slack://channel?team=" + m[1] + "&id=" + m[2];
        }
        // https://xxx.slack.com/archives/C.../p...（メッセージ単位はアプリ直行できないのでチャンネルを開く）
        if (SLACK_TEAM_ID && (m = u.pathname.match(/^\/archives\/([CDG][A-Z0-9]+)/))) {
          return "slack://channel?team=" + SLACK_TEAM_ID + "&id=" + m[1];
        }
        return null; // 変換できないものは元のリンク（Slack 標準の「アプリで開く」ページ）へ
      }
    }
  };
  // ---- エディタ系: ?to=vscode&path=/絶対パス[&line=行番号][&host=SSHのホスト名] ----
  // フォルダやファイルを VS Code で開く。host があれば Remote-SSH で SSH 先を開く。
  // 絶対パスだけ受け付け、".." を含むものは開かない。host は ~/.ssh/config の Host 名か IP（user@ も可）。
  var EDITOR_TARGETS = {
    vscode: { name: "VS Code", scheme: "vscode://file", remote: "vscode://vscode-remote/ssh-remote+" }
  };
  // VS Code は、今あるウィンドウではなく新しいウィンドウで開く
  var VSCODE_NEW_WINDOW = "?windowId=_blank";
  // ---- セッションの再開: ?to=claude-resume&session=<UUID>&path=/作業フォルダ[&host=SSHのホスト名] ----
  // claude -p で動かしたセッションの続きを開くための案内。
  // ブラウザはボタンを押さないとクリップボードに書かせないので、ボタン1回で「コピー → 開く」をする。
  // host なし（この PC）：Claude デスクトップで元のセッションを開く（claude://resume?session=<ID>）。
  //   開かなかったとき用に、もう一度開くリンクと、VS Code で開くボタン（コマンドをコピーして作業フォルダを開く）を出す。
  //   claude://resume は `claude --desktop --resume` が内部で使っているリンク（2026-10-19 に CLI 2.1.302 で確認。
  //   ドキュメントには載っていないので、版が上がって動かなくなったらコマンドに戻す）。Claude デスクトップが動いていないと開かないことがある。
  // host あり（SSH 先）：コマンド（claude --resume）をコピーして、VS Code で SSH 先の作業フォルダを開く。VS Code のターミナルに貼る。
  // ※Claude Code 拡張のパネル（vscode://anthropic.claude-code/open?session=）は、claude -p のセッションを開けなかった（2026-10-18・19）ので使わない。
  var RESUME_TARGETS = { "claude-resume": { name: "Claude Code" } };
  // ---- Codex のセッション: ?to=codex-resume&thread=<ID> ----
  // ai-ops のワーカー（codex exec）のセッションを、Codex のアプリ（ChatGPT デスクトップ）で開く（codex://threads/<ID>）。
  // スマホでは開けないので案内だけ出す。
  var CODEX_THREAD_URL = "codex://threads/";
  // ---- スマホ ----
  // スマホでは claude:// や vscode:// のアプリがないので、AI（to=claude）は自動で飛ばさずボタンを出す。
  // 「コピーして Claude Code を開く」：依頼文をコピーして claude.ai/code を開く。PC で常駐させた
  //   claude remote-control の環境を選んで新しいセッションを始め、貼り付ける（ai-ops の docs/claude-cli.md）。
  // 「チャットで開く」：claude.ai/new?q=。チャットは Drive のファイルを読めないので相談だけ。
  // PC で確かめるときは &mobile=1 を付ける。
  var MOBILE_CODE_URL = "https://claude.ai/code";
  // &pc=<PC のサーバー>（ai-ops の task serve を Tailscale で見せた https://<名前>.ts.net）があれば、
  // スマホではまずそこに回す。PC が依頼文の中の Notion のタスクでセッションを立て、そのセッションに飛ばす。
  // 届かない（Tailscale がオフ・PC が止まっている）ときは、下のボタンを出す。
  // ts.net 以外には回さない（関係ないサイトへ飛ばされないように）。
  var PC_HOSTS = /\.ts\.net$/;
  // ---- Mac 以外の PC（Windows など）----
  // ai-ops のセッションの記録（~/.claude/projects）は Mac にしかない。Windows で claude://resume を開いても、
  // その PC の Claude デスクトップには記録がないので開けない（2026-10-21）。
  // そのため Mac 以外の PC でも、&pc= があればスマホと同じく Mac のサーバーに回し、Mac でセッションを立てて
  // ブラウザ（claude.ai/code）で開く。届かなければ今までの動き。PC で確かめるときは &otherpc=1 を付ける。
  var PC_PROBE_MS = 4000;
  // =================================================

  var params = new URLSearchParams(location.search);
  var to = params.get("to") || "claude";
  var msg = document.getElementById("msg");
  var alt = document.getElementById("alt");
  var isMobile = params.get("mobile") === "1" || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); // iPadOS は Mac と名乗る
  var isOtherPc = !isMobile && (params.get("otherpc") === "1" || !/Mac/i.test(navigator.platform || navigator.userAgent));

  function copyText(text) {
    if (!navigator.clipboard) return Promise.reject();
    return navigator.clipboard.writeText(text);
  }

  // 依頼文の中の Notion のタスクの URL
  function notionTaskUrl(q) {
    var m = q.match(/https:\/\/(app\.notion\.com|www\.notion\.so)\/[^\s）)」]*[0-9a-f]{32}/i);
    return m ? m[0] : null;
  }

  function pcServer() {
    var u = null;
    try { u = new URL(params.get("pc") || ""); } catch (e) {}
    return u && u.protocol === "https:" && PC_HOSTS.test(u.hostname) ? u.origin : null;
  }

  // スマホで、PC のサーバーにつながれば pc + path に回す。つながらなければ onFail
  function goPc(path, onFail) {
    var pc = pcServer();
    if (!pc || !path) return onFail("");
    msg.textContent = "Mac でセッションを立てています…";
    var done = false;
    var fail = function () {
      if (done) return;
      done = true;
      onFail("Mac につながりませんでした（この端末の Tailscale がオフか、Mac が止まっています）。");
    };
    setTimeout(fail, PC_PROBE_MS);
    fetch(pc + "/", { mode: "no-cors", cache: "no-store" }).then(function () {
      if (done) return;
      done = true;
      location.href = pc + path;
    }, fail);
  }

  function tryPc(q, onFail) {
    var task = notionTaskUrl(q);
    goPc(task && "/open?url=" + encodeURIComponent(task), onFail);
  }

  // スマホで AI（to=claude）を開くとき：依頼文を見せて、ボタンで開く
  function showMobileAi(q, note) {
    msg.textContent = (note ? note + " " : "") + "スマホでは、どちらで開くかを選んでください。";
    document.getElementById("mobile-prompt").textContent = q;
    document.getElementById("mobile").hidden = false;
    var copied = document.getElementById("m-copied");
    document.getElementById("m-code").addEventListener("click", function () {
      var go = function () { location.href = MOBILE_CODE_URL; };
      copyText(q).then(go, function () {
        copied.textContent = "コピーできませんでした。上の文を選んでコピーしてください";
        setTimeout(go, 1500);
      });
    });
    document.getElementById("m-chat").addEventListener("click", function () {
      location.href = "https://claude.ai/new?q=" + encodeURIComponent(q);
    });
  }

  // アプリに渡したあと、このタブを閉じる（タブが増え続けないように）。
  // アプリが開かなかったときに下のリンクを押せるよう、少し待ってから閉じる。
  // ブラウザが閉じさせない場合（リンクから開いたタブでないとき）は、何も起きずに残る。
  var CLOSE_AFTER_MS = 3000;
  function openAppAndClose(href) {
    location.href = href;
    setTimeout(function () { window.close(); }, CLOSE_AFTER_MS);
  }

  function fallbackLink(href, label) {
    var a = document.createElement("a");
    a.href = href; a.textContent = label;
    alt.append("アプリが開かない場合は ", a);
  }

  // PC で AI（to=claude など）をアプリで開く
  function openAi(t, q, note) {
    var enc = encodeURIComponent(q);
    var appUrl = t.app(enc);
    if (t.web) fallbackLink(t.web(enc), "ブラウザで開く");
    var trusted = TRUSTED_PREFIXES.some(function (p) { return q.indexOf(p) === 0; });
    if (trusted) {
      msg.textContent = (note ? note + " " : "") + t.name + "を開いています…";
      openAppAndClose(appUrl);
    } else {
      msg.textContent = "次の内容で" + t.name + "を開きます。心当たりがなければ閉じてください。";
      document.getElementById("preview").textContent = q;
      document.getElementById("confirm").hidden = false;
      document.getElementById("go").addEventListener("click", function () { openAppAndClose(appUrl); });
    }
  }

  if (AI_TARGETS[to]) {
    var t = AI_TARGETS[to];
    var q = params.get("q") || "";
    if (!q) {
      msg.textContent = "プロンプトが空です。q= に開きたい内容を入れてください。";
    } else if (isMobile && (to === "claude" || to === "claude-web")) {
      tryPc(q, function (note) { showMobileAi(q, note); });
    } else if (isOtherPc && to === "claude" && pcServer() && notionTaskUrl(q)) {
      tryPc(q, function (note) { openAi(t, q, note); });
    } else {
      openAi(t, q, "");
    }
  } else if (APP_TARGETS[to]) {
    var a = APP_TARGETS[to];
    var u = null;
    try { u = new URL(params.get("url") || ""); } catch (e) {}
    if (!u || u.protocol !== "https:" || !a.hosts.test(u.hostname)) {
      msg.textContent = a.name + "のリンクではないため開けません。url= に" + a.name + "のhttpsリンクを入れてください。";
    } else {
      var dest = a.app(u);
      fallbackLink(u.href, "ブラウザで開く");
      msg.textContent = a.name + "を開いています…";
      if (dest) openAppAndClose(dest); else location.href = u.href;
    }
  } else if (to === "codex-resume") {
    var thread = params.get("thread") || "";
    if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(thread)) {
      msg.textContent = "thread= には Codex のセッション ID を入れてください。";
    } else if (isMobile) {
      msg.textContent = "Codex のセッションは PC の Codex（ChatGPT デスクトップ）で開くものです。";
      alt.textContent = "セッション ID：" + thread;
    } else {
      msg.textContent = "Codex でセッションを開いています…";
      fallbackLink(CODEX_THREAD_URL + thread, "もう一度開く");
      openAppAndClose(CODEX_THREAD_URL + thread);
    }
  } else if (isMobile && (EDITOR_TARGETS[to] || RESUME_TARGETS[to])) {
    // スマホには VS Code も Claude デスクトップもない。セッションの再開で &pc= があれば、
    // PC のサーバー（/resume）に回して、PC でそのセッションの続きを立てる（SSH 先のセッションはまだ回さない）
    var showPcOnly = function (note) {
      msg.textContent = (note ? note + " " : "") + "このリンクは PC で開くものです（VS Code・Claude デスクトップ）。スマホでは開けません。";
      alt.textContent = "スマホで続けるときは、Notion の「AIで開く」から新しいセッションを始めてください。";
    };
    var rs = params.get("session") || "";
    if (RESUME_TARGETS[to] && !params.get("host") &&
        /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(rs)) {
      goPc("/resume?session=" + rs, showPcOnly);
    } else {
      showPcOnly("");
    }
  } else if (isOtherPc && RESUME_TARGETS[to] && !params.get("host") && pcServer() &&
             /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(params.get("session") || "")) {
    // Mac 以外の PC：セッションの記録は Mac にあるので、Mac のサーバー（/resume）で続きを立てる
    goPc("/resume?session=" + params.get("session"), function (note) {
      msg.textContent = (note ? note + " " : "") + "このセッションは Mac にあります。Mac の Claude デスクトップで開くか、" +
        "この端末の Tailscale をオンにしてから開き直してください。";
      alt.textContent = "セッション ID：" + params.get("session");
    });
  } else if (EDITOR_TARGETS[to]) {
    var ed = EDITOR_TARGETS[to];
    var path = params.get("path") || "";
    var line = params.get("line") || "";
    var host = params.get("host") || "";
    if (path.charAt(0) !== "/" || path.split("/").indexOf("..") !== -1) {
      msg.textContent = "path= には開きたいフォルダかファイルの絶対パス（/ で始まるもの）を入れてください。";
    } else if (line && !/^\d+$/.test(line)) {
      msg.textContent = "line= には行番号（数字）を入れてください。";
    } else if (host && !/^([A-Za-z0-9._-]+@)?[A-Za-z0-9._-]+$/.test(host)) {
      msg.textContent = "host= には SSH のホスト名（~/.ssh/config の Host 名か IP）を入れてください。";
    } else {
      // SSH 先で行番号まで飛べるかは未確認なので、SSH 先ではファイルかフォルダを開くだけにしている
      var edUrl = (host ? ed.remote + host + encodeURI(path)
                        : ed.scheme + encodeURI(path) + (line ? ":" + line : "")) + VSCODE_NEW_WINDOW;
      msg.textContent = ed.name + "で開いています…" + (host ? "（SSH: " + host + "）" : "");
      alt.textContent = (host ? host + ":" : "") + path;
      openAppAndClose(edUrl);
    }
  } else if (RESUME_TARGETS[to]) {
    var rt = RESUME_TARGETS[to];
    var session = params.get("session") || "";
    var rpath = params.get("path") || "";
    var rhost = params.get("host") || "";
    if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(session)) {
      msg.textContent = "session= にはセッション ID（UUID）を入れてください。";
    } else if (rpath.charAt(0) !== "/" || rpath.split("/").indexOf("..") !== -1 || !/^[A-Za-z0-9._\/-]+$/.test(rpath)) {
      msg.textContent = "path= には作業フォルダの絶対パス（/ で始まるもの）を入れてください。";
    } else if (rhost && !/^([A-Za-z0-9._-]+@)?[A-Za-z0-9._-]+$/.test(rhost)) {
      msg.textContent = "host= には SSH のホスト名（~/.ssh/config の Host 名か IP）を入れてください。";
    } else {
      var cmd = "cd " + rpath + " && claude --resume " + session;
      var cmdBox = document.getElementById("resume-cmd");
      cmdBox.textContent = "# " + (rhost ? rhost : "この PC") + " の VS Code のターミナルで実行\n" + cmd;
      document.getElementById("resume").hidden = false;
      var copied = document.getElementById("copied");
      function copyCmd() {
        if (!navigator.clipboard) return Promise.reject();
        return navigator.clipboard.writeText(cmd).then(function () { copied.textContent = "コピーしました"; });
      }
      var copyBtn = document.getElementById("copy");
      var folderUrl = (rhost ? EDITOR_TARGETS.vscode.remote + rhost + encodeURI(rpath)
                             : EDITOR_TARGETS.vscode.scheme + encodeURI(rpath)) + VSCODE_NEW_WINDOW;
      copyBtn.textContent = "コピーして VS Code で開く";
      copyBtn.addEventListener("click", function () {
        var go = function () { location.href = folderUrl; };
        copyCmd().then(go, function () {
          copied.textContent = "コピーできませんでした。上のコマンドを選んでコピーしてください";
          go();
        });
      });
      if (rhost) {
        msg.textContent = "ボタンを押すと、再開のコマンドをコピーして、VS Code で " + rhost +
          " の作業フォルダを開きます。VS Code のターミナル（Ctrl+`）に貼り付けてください。";
      } else {
        var desktopUrl = "claude://resume?session=" + session;
        msg.textContent = "Claude デスクトップでセッションを開いています…";
        var links = document.getElementById("resume-links");
        var again = document.createElement("a");
        again.href = desktopUrl;
        again.textContent = "開かないときは、Claude デスクトップを起動してからここを押す";
        links.appendChild(again);
        alt.textContent = "VS Code で続けるときは、上のボタンでコマンドをコピーし、VS Code のターミナルに貼り付けてください。";
        location.href = desktopUrl;
      }
    }
  } else {
    msg.textContent = "転送先「" + to + "」は登録されていません。to= には " +
      Object.keys(AI_TARGETS).concat(Object.keys(APP_TARGETS), Object.keys(EDITOR_TARGETS), Object.keys(RESUME_TARGETS)).join(" / ") + " のどれかを指定してください。";
  }
</script>
</body>
</html>
